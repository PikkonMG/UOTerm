name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The watch window draws with eframe and plays sound with rodio. Both
      # link to Linux system libraries that the runner image does not carry.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: CLI help
        run: cargo run -p uoterm -- --help

  deny-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Forbid client data files
        run: |
          if git ls-files | grep -Ei '\.(mul|uop|idx|def)$'; then
            echo "Game data files must not be committed"
            exit 1
          fi

  deny-other-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No file that ships may name a client or assistant tool. Server
      # emulators may be named, because a user aims this client at a private
      # shard and needs to know which server behaviour it targets. Client and
      # tool names carry no such need, so they stay out. The match is
      # whole-word to spare normal English. One tool shares its name with the
      # Stealth skill, so only "stealth client" is matched for it.
      - name: Forbid naming a client or tool
        run: |
          if git grep -niwE 'classicuo|orionuo|razor|razorenhanced|neouo|uosteam|tazuo|uoassist|stealth ?client' \
              -- crates docs README.md LEGAL.md Cargo.toml; then
            echo "A shipped file names a client or assistant tool. Say what it does instead."
            exit 1
          fi
