[package]
name = "uoterm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Headless Ultima Online client and agent runtime"

[[bin]]
name = "uoterm"
path = "src/main.rs"

[dependencies]
uoterm-protocol.workspace = true
uoterm-world.workspace = true
uoterm-nav.workspace = true
uoterm-runtime.workspace = true
uoterm-assist.workspace = true
uoterm-view.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
reqwest.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
thiserror.workspace = true
rand.workspace = true
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3"] }
gilrs = "0.11"
rustysynth = "1.3"

[dev-dependencies]
uoterm-view = { workspace = true, features = ["test-fixtures"] }
uoterm-nav = { workspace = true, features = ["test-fixtures"] }
# Sends one request through a router with no server, to test the routes.
tower = { version = "0.5", features = ["util"] }
